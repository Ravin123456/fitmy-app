<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup - FitMY</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0A0A0F;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .onboarding-card {
            width: 100%;
            max-width: 600px;
            background: #1A1A24;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            color: #94A3B8;
            font-weight: 500;
        }

        input, select {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00F0FF;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="onboarding-card">
        <div class="setup-header">
            <h2 class="section-title" style="margin-bottom: 5px;">Personalize Your AI</h2>
            <p class="section-subtitle">Let's set up your profile to generate accurate plans</p>
        </div>

        <form id="profile-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="age">Age (years)</label>
                    <input type="number" id="age" name="age" min="15" max="100" required>
                </div>
                
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" name="height" step="0.1" required>
                </div>

                <div class="form-group full-width">
                    <label for="activity_level">Activity Level</label>
                    <select id="activity_level" name="activity_level" required>
                        <option value="sedentary">Sedentary (Little to no exercise)</option>
                        <option value="lightly_active">Lightly Active (1-3 days/week)</option>
                        <option value="moderately_active">Moderately Active (3-5 days/week)</option>
                        <option value="very_active">Very Active (6-7 days/week)</option>
                        <option value="extra_active">Extra Active (Very hard physical job/training twice a day)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="goal">Primary Fitness Goal</label>
                    <select id="goal" name="goal" required>
                        <option value="fat_loss">Fat Loss</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="muscle_gain">Muscle Gain</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 30px;" id="save-btn">
                Generate My Plan
            </button>
        </form>
    </div>

    <!-- Need to load scripts -->
    <script src="app.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!auth.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            // Pre-fill form if data exists and not resetting
            const urlParams = new URLSearchParams(window.location.search);
            const isReset = urlParams.get('reset') === 'true';

            if (!isReset) {
                try {
                    const profile = await api.request('/api/profile');
                    if (profile) {
                        if (profile.age) document.getElementById('age').value = profile.age;
                        if (profile.gender) document.getElementById('gender').value = profile.gender;
                        if (profile.weight) document.getElementById('weight').value = profile.weight;
                        if (profile.height) document.getElementById('height').value = profile.height;
                        if (profile.activity_level) document.getElementById('activity_level').value = profile.activity_level;
                        if (profile.goal) document.getElementById('goal').value = profile.goal;
                    }
                } catch (err) {
                    console.error("Failed to fetch profile", err);
                }
            }
        });

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const ogText = btn.textContent;
            btn.textContent = 'Saving & Crunching Numbers...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            const data = {
                age: parseInt(formData.get('age')),
                gender: formData.get('gender'),
                weight: parseFloat(formData.get('weight')),
                height: parseFloat(formData.get('height')),
                activity_level: formData.get('activity_level'),
                goal: formData.get('goal')
            };

            try {
                const res = await api.request('/api/profile', {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
                
                if (res) {
                    const intendedPlan = localStorage.getItem('intended_plan');
                    if (intendedPlan && intendedPlan !== 'free') {
                        window.location.href = 'dashboard.html?checkout=true';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                alert('Failed to update profile: ' + err.message);
                btn.textContent = ogText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
