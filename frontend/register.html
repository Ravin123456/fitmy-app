<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Free - FitMY</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body
    style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0A0A0F; padding: 20px 0;">
    <div class="pricing-card" style="width: 100%; max-width: 400px; text-align: center; padding: 40px 20px;">
        <h2 class="section-title" style="margin-bottom: 5px;">Create Account</h2>
        <p class="section-subtitle">Start your fitness journey today</p>

        <form id="register-form"
            style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px; text-align: left;">
            <input type="text" id="full_name" placeholder="Full Name" required
                style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #1A1A24; color: white; font-family: 'Inter', sans-serif;">
            <input type="email" id="email" placeholder="Email Address" required
                style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #1A1A24; color: white; font-family: 'Inter', sans-serif;">
            <input type="password" id="password" placeholder="Password (min 8 chars)" required minlength="8"
                style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #1A1A24; color: white; font-family: 'Inter', sans-serif;">
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign Up</button>
        </form>

        <div style="margin: 25px 0; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <div style="height: 1px; background: rgba(255,255,255,0.1); flex: 1;"></div>
            <span style="color: #94A3B8; font-size: 0.9rem;">or</span>
            <div style="height: 1px; background: rgba(255,255,255,0.1); flex: 1;"></div>
        </div>

        <a href="http://localhost:8001/api/auth/google?nocache=2" class="btn btn-outline"
            style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                    <path fill="#4285F4"
                        d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z" />
                    <path fill="#34A853"
                        d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z" />
                    <path fill="#FBBC05"
                        d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z" />
                    <path fill="#EA4335"
                        d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z" />
                </g>
            </svg>
            Sign up with Google
        </a>

        <p style="margin-top: 30px; font-size: 0.95rem; color: #94A3B8;">
            Already have an account? <a href="login.html"
                style="color: #00F0FF; text-decoration: none; font-weight: 500;">Log in</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const ogText = btn.textContent;
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8001/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('fitmy_access_token', data.access_token);
                    localStorage.setItem('fitmy_refresh_token', data.refresh_token);
                    alert('Registration successful! Redirecting to setup...');
                    window.location.href = 'onboarding.html';
                } else {
                    alert(data.detail || 'Registration failed. Please try again.');
                }
            } catch (err) {
                alert('An error occurred connecting to the server.');
            } finally {
                btn.textContent = ogText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
